<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="robots"
      content="noindex"
    />

    <title>
      NagarikSuraksha
    </title>

    <script>
      (function () {
        var requestedUrl =
          window.location.pathname +
          window.location.search +
          window.location.hash;

        var redirectUrl =
          "/?spa_redirect=" +
          encodeURIComponent(
            requestedUrl
          );

        window.location.replace(
          redirectUrl
        );
      })();
    </script>
  </head>

  <body>
    <p>
      Redirecting to NagarikSuraksha...
    </p>
  </body>
</html>
